name = "aurora-live"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Writes straight to the bucket through a binding, so the Worker needs no
# R2 access key at all. The S3 credentials are only for the GitHub Actions
# bulk tier, which has no binding available to it.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "aurora-data"

# Four schedules rather than one, because the free plan's 10 ms CPU limit is
# PER INVOCATION. Running the bundle, the alerts and the slow tier off a
# single cron made them share one 10 ms budget -- ctx.waitUntil bills the
# deferred work back to the invocation that scheduled it -- and the Worker
# was dying with `exceededCpu`. Split, each job gets its own 10 ms.
#
# The fast tier runs on every EVEN minute, so everything else must be odd or
# it would share an invocation's budget. See the note above CRON_FAST in
# index.js for the parity arithmetic that guarantees it.
#
#   */2      fast tier: 6.5 KB propagated solar wind + 11.6 KB hemi power.
#            Matches AuroraProvider's 120-second refresh timer. Publishing
#            faster than the app reads would only rewrite R2 for nobody; the
#            pair moved from 3 minutes to 2 to cut the sawtooth in the
#            on-screen "observed through" age, which sat at 10-13 minutes and
#            now sits at 8-11.
#   1-59/4   storm / flare / CME thresholds, on odd minutes. Every 4 minutes
#            rather than 3 because a step of 3 alternates parity and would
#            collide with the fast tier every other run. The extra minute is
#            immaterial: NOAA's G-scale moves on 3-hour Kp and the flare
#            lookback is 90 minutes, so nothing here resolves faster than
#            the gap.
#   3,35     slow tier: DONKI and the hemi archive. Hours-scale data, and
#            DONKI should be touched as little as the app tolerates.
#   15,47    repair tier: one full RTSW feed per run, mag before the half
#            hour and wind after. ~2.7-2.9 ms of JSON.parse each, which only
#            fits when it is the sole job in the invocation.
[triggers]
crons = ["*/2 * * * *", "1-59/4 * * * *", "3,35 * * * *", "15,47 * * * *"]

[observability]
enabled = true
